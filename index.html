<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testly - AI Notes to Quiz Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <div class="max-w-4xl mx-auto px-4 py-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-indigo-600 mb-2">Testly</h1>
            <p class="text-slate-600">Turn your notes and homework photos into instant study quizzes!</p>
        </header>

        <main class="bg-white rounded-xl shadow-md p-6 mb-8">
            <div id="upload-container" class="border-2 border-dashed border-slate-300 rounded-lg p-8 text-center hover:border-indigo-500 transition-colors cursor-pointer">
                <i class="fa-solid fa-cloud-arrow-up text-4xl text-indigo-500 mb-3"></i>
                <p class="text-slate-700 font-medium">Click to upload or drag and drop your photo here</p>
                <p class="text-xs text-slate-400 mt-1">PNG, JPG, or JPEG supported</p>
                <input type="file" id="file-input" class="hidden" accept="image/*">
            </div>

            <div id="preview-container" class="hidden mt-6 text-center">
                <img id="image-preview" class="max-h-64 mx-auto rounded-lg shadow-sm border border-slate-200 mb-4" alt="Notes Preview">
                <button id="analyze-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-lg transition-colors">
                    <i class="fa-solid fa-wand-magic-sparkles mr-2"></i>Analyze Photo with AI
                </button>
            </div>

            <div id="loading-spinner" class="hidden my-8 text-center">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-500 border-t-transparent"></div>
                <p class="text-slate-600 mt-2 font-medium">Generating your quiz...</p>
            </div>
        </main>

        <section id="quiz-container" class="hidden bg-white rounded-xl shadow-md p-6">
            <h2 class="text-2xl font-bold text-slate-800 mb-4">Your Generated Quiz</h2>
            <div id="quiz-content" class="space-y-6"></div>
        </section>
    </div>

    <script>
        const uploadContainer = document.getElementById('upload-container');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');
        const analyzeBtn = document.getElementById('analyze-btn');
        const loadingSpinner = document.getElementById('loading-spinner');
        const quizContainer = document.getElementById('quiz-container');
        const quizContent = document.getElementById('quiz-content');

        let selectedFile = null;

        uploadContainer.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    imagePreview.src = event.target.result;
                    previewContainer.classList.remove('hidden');
                };
                reader.readAsDataURL(selectedFile);
            }
        });

        analyzeBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            previewContainer.classList.add('hidden');
            loadingSpinner.classList.remove('hidden');
            quizContainer.classList.add('hidden');

            try {
                const base64Image = await convertToBase64(selectedFile);
                const cleanBase64 = base64Image.split(',')[1];

                const response = await fetch('https://testly-backend.vercel.app/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        imageBase64: cleanBase64,
                        mimeType: selectedFile.type || 'image/jpeg'
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                displayQuiz(data);
            } catch (err) {
                alert('Error generating quiz: ' + err.message);
                previewContainer.classList.remove('hidden');
            } finally {
                loadingSpinner.classList.add('hidden');
            }
        });

        function convertToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
                reader.readAsDataURL(file);
            });
        }

        function displayQuiz(data) {
            quizContent.innerHTML = '';
            if (typeof data === 'string') {
                quizContent.innerHTML = `<div class="prose max-w-none">${data}</div>`;
            } else {
                quizContent.innerHTML = `<pre class="bg-slate-100 p-4 rounded-lg overflow-x-auto">${JSON.stringify(data, null, 2)}</pre>`;
            }
            quizContainer.classList.remove('hidden');
        }
    </script>
</body>
</html>
